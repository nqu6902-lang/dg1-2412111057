services:
  web:
    build: .
    environment:
      MSSV: "2412111057"
      HO_TEN: "Minh"
      PORT: "5000"
    volumes:
      - ./app/data:/app/app/data
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
